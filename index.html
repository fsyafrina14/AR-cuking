<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Kucing Siamese</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>
</head>

<body>

    <h1>🐱 AR Kucing Siamese</h1>

    <model-viewer
        src="Cat_Siamese.glb"
        alt="Kucing Siamese 3D"
        camera-controls
        autoplay
        animation-loop
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1"
        style="width: 100%; height: 500px;">
    </model-viewer>

</body>
</html>
